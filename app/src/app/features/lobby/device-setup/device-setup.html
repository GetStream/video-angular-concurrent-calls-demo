<section class="setup">
  <div class="setup__stage">
    <!-- Local preview only: nothing is joined or published yet, so this is the camera's
         own MediaStream rather than a bound participant track. -->
    <video #preview class="setup__video" muted playsinline></video>

    @if (!cameraOn()) {
      <div class="setup__placeholder">
        <mat-icon>videocam_off</mat-icon>
        <span>Camera off</span>
      </div>
    }

    @if (blocked()) {
      <div class="setup__blocked">
        <mat-icon>block</mat-icon>
        <p>
          Your browser is blocking camera or microphone access. Allow it in the address bar, then
          reload.
        </p>
      </div>
    }

    <span class="setup__who">{{ userLabel() }}</span>

    @if (blurChoice() === 'blur') {
      <span class="setup__badge">
        <mat-icon>blur_on</mat-icon>
        background: blur
      </span>
    }

    <div class="setup__toggles">
      <button
        matIconButton
        type="button"
        class="toggle"
        [class.toggle--off]="!micOn()"
        [matTooltip]="micOn() ? 'Mute microphone' : 'Unmute microphone'"
        [attr.aria-label]="micOn() ? 'Mute microphone' : 'Unmute microphone'"
        (click)="toggleMic()"
      >
        <mat-icon>{{ micOn() ? 'mic' : 'mic_off' }}</mat-icon>
      </button>
      <button
        matIconButton
        type="button"
        class="toggle"
        [class.toggle--off]="!cameraOn()"
        [matTooltip]="cameraOn() ? 'Turn off camera' : 'Turn on camera'"
        [attr.aria-label]="cameraOn() ? 'Turn off camera' : 'Turn on camera'"
        (click)="toggleCamera()"
      >
        <mat-icon>{{ cameraOn() ? 'videocam' : 'videocam_off' }}</mat-icon>
      </button>
    </div>

    <!-- Level meter runs off the mic's own stream, so it works before joining. -->
    <div class="setup__meter" role="presentation">
      <div class="setup__meter-fill" [style.width.%]="micLevel()"></div>
    </div>
  </div>

  <!-- The same pickers the in-call settings dialog uses. -->
  <app-device-controls [call]="call()" />
</section>
