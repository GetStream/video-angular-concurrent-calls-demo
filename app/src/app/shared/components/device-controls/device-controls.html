<!-- One compact trigger per choice: the icon says which choice, the text says its value.
     A label reading "Microphone" beside a microphone icon is the same word twice, and three
     outlined form fields with floating labels turn a device check into a data-entry form. -->
<div class="controls">
  <div class="pickers">
    @for (picker of pickers(); track picker.kind) {
      <!-- A plain button, not `matButton`: Material projects children into its own label
           span, which reorders a three-part row and puts the chevron beside the icon. -->
      <button
        type="button"
        class="picker"
        [attr.data-kind]="picker.kind"
        [attr.aria-label]="picker.kind + ': ' + picker.current"
        [matMenuTriggerFor]="menu"
      >
        @if (picker.busy) {
          <mat-spinner class="picker__icon" diameter="18" />
        } @else {
          <mat-icon class="picker__icon">{{ picker.icon }}</mat-icon>
        }
        <span class="picker__name">{{ picker.current }}</span>
        <mat-icon class="picker__chevron">expand_more</mat-icon>
      </button>

      <mat-menu #menu>
        @for (option of picker.options; track option.id) {
          <button
            mat-menu-item
            type="button"
            role="menuitemradio"
            [attr.aria-checked]="option.id === picker.selected"
            (click)="choose(picker.kind, option.id)"
          >
            <mat-icon>{{ option.id === picker.selected ? 'check' : '' }}</mat-icon>
            <span>{{ option.label }}</span>
          </button>
        } @empty {
          <!-- Reachable whenever permission has not been granted: `listDevices()` returns
               nothing until the browser has a reason to name the hardware. -->
          <button mat-menu-item type="button" disabled>{{ picker.empty }}</button>
        }
      </mat-menu>
    }
  </div>

  @if (blurDegraded()) {
    <p class="warn">Blur is struggling here — turning it off will smooth your video.</p>
  }
</div>
