<header class="chrome">
  <div class="chrome__brand">
    <span class="chrome__app">Video demo</span>
    @if (context()) {
      <span class="chrome__context">{{ context() }}</span>
    }
  </div>

  <div class="chrome__identity">
    @if (isProctor()) {
      <!-- Recordings outlive the call that made them, so they belong in the app chrome
           rather than in a control bar. Proctors only: `list-recordings` is granted to
           `call_member_proctor` and refused to students by the server. -->
      <a
        matButton
        routerLink="/recordings"
        routerLinkActive="chrome__nav--here"
        class="chrome__nav"
      >
        <mat-icon>video_library</mat-icon>
        Recordings
      </a>
    }

    @if (user(); as signedIn) {
      <span class="chrome__user">
        <span class="chrome__avatar" aria-hidden="true">{{ initials(signedIn.name) }}</span>
        <span class="chrome__id">{{ signedIn.id }}</span>
        <span class="chrome__role">{{ signedIn.role }}</span>
      </span>
      <button
        matIconButton
        type="button"
        matTooltip="Sign out"
        aria-label="Sign out"
        (click)="signOut()"
      >
        <mat-icon>logout</mat-icon>
      </button>
    } @else {
      <span class="chrome__user chrome__user--empty">
        <mat-icon>person_outline</mat-icon>
        nobody yet
      </span>
    }
  </div>
</header>
